<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="График">
<meta name="theme-color" content="#f2f2f7">
<title>Мой график</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23007aff'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white'>💰</text></svg>">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    margin: 0; padding: 0; background: #f2f2f7; color: #000;
    padding-bottom: 100px;
  }
  
  /* Верхняя панель */
  .header {
    background: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid #e5e5ea; padding-top: calc(12px + env(safe-area-inset-top));
    display: flex; justify-content: space-between; align-items: center;
  }
  .header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .rate-btn { font-size: 14px; color: #007aff; background: none; border: none; padding: 8px; font-weight: 500;}

  /* Навигация по месяцам */
  .month-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px; background: #fff; margin-bottom: 12px;
    border-bottom: 1px solid #e5e5ea;
  }
  .month-nav button {
    background: #f2f2f7; border: none; border-radius: 50%; width: 36px; height: 36px;
    font-size: 18px; color: #007aff; display: flex; justify-content: center; align-items: center;
  }
  .month-title { font-size: 20px; font-weight: 600; }

  /* Итоги */
  .summary { display: flex; padding: 0 16px; gap: 12px; margin-bottom: 16px; }
  .summary-card {
    flex: 1; background: #fff; border-radius: 14px; padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05); text-align: center;
  }
  .summary-card .label { font-size: 13px; color: #8e8e93; margin-bottom: 4px; font-weight: 500; text-transform: uppercase;}
  .summary-card .value { font-size: 22px; font-weight: 600; }
  .summary-card .value.money { color: #34c759; }

  /* Список смен */
  .shifts-list { padding: 0 16px; }
  .shift-item {
    background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .shift-date { font-weight: 600; font-size: 16px; margin-bottom: 2px; }
  .shift-time { font-size: 14px; color: #8e8e93; }
  .shift-right { text-align: right; }
  .shift-hours { font-weight: 500; font-size: 15px; margin-bottom: 2px; }
  .shift-money { color: #34c759; font-weight: 600; font-size: 15px; }
  .del-btn {
    background: #ff3b30; color: #fff; border: none; border-radius: 8px;
    padding: 6px 10px; font-size: 12px; margin-top: 6px;
  }
  .empty { text-align: center; color: #8e8e93; padding: 40px 20px; font-size: 15px; }

  /* Плавающая кнопка Добавить */
  .fab {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    background: #007aff; color: #fff; border: none; border-radius: 30px;
    padding: 14px 24px; font-size: 17px; font-weight: 600;
    box-shadow: 0 4px 12px rgba(0,122,255,.3);
    display: flex; align-items: center; gap: 8px; z-index: 20;
  }
  .fab:active { background: #0062cc; }

  /* Модальное окно */
  .modal {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); z-index: 30; align-items: flex-end;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: #f2f2f7; width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h2 { margin: 0; font-size: 20px; }
  .close-btn { background: none; border: none; color: #007aff; font-size: 17px; font-weight: 500; padding: 0; }
  
  label { display: block; font-size: 13px; color: #8e8e93; margin: 12px 0 4px; font-weight: 500; }
  input { width: 100%; padding: 12px; font-size: 17px; border: 1px solid #ddd; border-radius: 10px; background: #fff; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .btn-save { margin-top: 20px; background: #007aff; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 17px; font-weight: 600; width: 100%; }
  .preview { font-size: 14px; color: #8e8e93; margin-top: 12px; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <h1>📅 График</h1>
  <button class="rate-btn" onclick="changeRate()">Ставка: <span id="rateDisplay">276</span> ₽/ч</button>
</div>

<!-- Навигация по месяцам -->
<div class="month-nav">
  <button onclick="changeMonth(-1)">←</button>
  <div class="month-title" id="monthTitle">Ноябрь 2026</div>
  <button onclick="changeMonth(1)">→</button>
</div>

<!-- Итоги за выбранный месяц -->
<div class="summary">
  <div class="summary-card">
    <div class="label">Часов</div>
    <div class="value" id="monthHours">0</div>
  </div>
  <div class="summary-card">
    <div class="label">Заработано</div>
    <div class="value money" id="monthMoney">0 ₽</div>
  </div>
</div>

<!-- Список смен -->
<div class="shifts-list" id="list"></div>

<!-- Кнопка добавления -->
<button class="fab" onclick="openModal()">
  <span style="font-size:22px">+</span> Добавить смену
</button>

<!-- Модальное окно -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Новая смена</h2>
      <button class="close-btn" onclick="closeModal()">Отмена</button>
    </div>
    
    <label>Дата</label>
    <input type="date" id="date">
    
    <div class="row">
      <div>
        <label>Начало</label>
        <input type="time" id="start" value="14:00">
      </div>
      <div>
        <label>Конец</label>
        <input type="time" id="end" value="22:00">
      </div>
    </div>
    
    <label>Перерыв (минут, вычитается)</label>
    <input type="number" id="breakMin" value="30" min="0" step="5">
    
    <div class="preview" id="preview">В зачёт: —</div>
    
    <button class="btn-save" onclick="addShift()">Сохранить смену</button>
  </div>
</div>

<script>
const KEY = 'my_schedule_v5';
const RATE_KEY = 'my_rate';
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

let rate = parseFloat(localStorage.getItem(RATE_KEY)) || 276;
let currentDate = new Date();
let currentMonth = currentDate.getMonth();
let currentYear = currentDate.getFullYear();

function load() { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }
function fmtMoney(v) { return v.toLocaleString('ru-RU') + ' ₽'; }
function fmtHours(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `${h} ч ${m} мин` : `${h} ч`;
}

function changeRate() {
  const v = prompt('Введите стоимость 1 часа (в рублях):', rate);
  if (v !== null && !isNaN(v) && v > 0) {
    rate = parseFloat(v);
    localStorage.setItem(RATE_KEY, rate);
    document.getElementById('rateDisplay').textContent = rate;
    render();
  }
}

function updateMonthTitle() {
  document.getElementById('monthTitle').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
}

function changeMonth(offset) {
  currentMonth += offset;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  updateMonthTitle();
  render();
}

function calcMins() {
  const start = document.getElementById('start').value;
  const end = document.getElementById('end').value;
  const br = parseInt(document.getElementById('breakMin').value) || 0;
  if (!start || !end) return null;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins <= 0) mins += 24 * 60;
  return { gross: mins, net: Math.max(0, mins - br) };
}

function updatePreview() {
  const r = calcMins();
  const el = document.getElementById('preview');
  if (!r) { el.textContent = 'В зачёт: —'; return; }
  el.textContent = `В зачёт: ${fmtHours(r.net)} · ${fmtMoney(Math.round((r.net/60)*rate))}`;
}

function openModal() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  document.getElementById('date').value = `${y}-${m}-${d}`;
  document.getElementById('modal').classList.add('active');
  updatePreview();
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function addShift() {
  const date = document.getElementById('date').value;
  const start = document.getElementById('start').value;
  const end = document.getElementById('end').value;
  const br = parseInt(document.getElementById('breakMin').value) || 0;
  if (!date || !start || !end) { alert('Заполните дату и время'); return; }
  const r = calcMins();
  if (!r || r.net <= 0) { alert('Смена должна быть больше перерыва'); return; }

  const data = load();
  data.push({ date, start, end, br, mins: r.net });
  data.sort((a,b) => a.date.localeCompare(b.date));
  save(data);
  
  // Переключаемся на месяц добавленной смены
  const [y, m] = date.split('-');
  currentYear = parseInt(y);
  currentMonth = parseInt(m) - 1;
  updateMonthTitle();
  
  closeModal();
  render();
}

function removeShift(index) {
  if (confirm('Удалить эту смену?')) {
    const data = load();
    data.splice(index, 1);
    save(data);
    render();
  }
}

function render() {
  const data = load();
  const list = document.getElementById('list');
  
  // Фильтруем по текущему месяцу
  const prefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
  const monthShifts = data.map((s, i) => ({ ...s, index: i })).filter(s => s.date.startsWith(prefix));
  
  // Считаем итоги
  const totalMins = monthShifts.reduce((a, s) => a + s.mins, 0);
  const totalMoney = Math.round((totalMins / 60) * rate);
  
  document.getElementById('monthHours').textContent = fmtHours(totalMins);
  document.getElementById('monthMoney').textContent = fmtMoney(totalMoney);
  
  // Рендерим список
  if (!monthShifts.length) {
    list.innerHTML = '<div class="empty">В этом месяце пока нет смен</div>';
    return;
  }
  
  let html = '';
  monthShifts.forEach(s => {
    const [y, m, d] = s.date.split('-');
    const money = Math.round((s.mins / 60) * rate);
    const brText = s.br ? ` · перерыв ${s.br} мин` : '';
    
    html += `<div class="shift-item">
      <div>
        <div class="shift-date">${d}.${m}</div>
        <div class="shift-time">${s.start} – ${s.end}${brText}</div>
      </div>
      <div class="shift-right">
        <div class="shift-hours">${fmtHours(s.mins)}</div>
        <div class="shift-money">${fmtMoney(money)}</div>
        <button class="del-btn" onclick="removeShift(${s.index})">Удалить</button>
      </div>
    </div>`;
  });
  
  list.innerHTML = html;
}

// Инициализация
document.getElementById('rateDisplay').textContent = rate;
updateMonthTitle();
['start','end','breakMin'].forEach(id => document.getElementById(id).addEventListener('input', updatePreview));

// Закрытие модалки по клику на фон
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal')) closeModal();
});

render();
</script>
</body>
</html>
