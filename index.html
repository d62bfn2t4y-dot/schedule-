<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="График">
<meta name="theme-color" content="#007aff">
<title>График</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23007aff'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white'>💰</text></svg>">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 600px; margin: 0 auto; padding: 16px 12px 60px;
    background: #f2f2f7; color: #000;
    padding-top: calc(16px + env(safe-area-inset-top));
  }
  h1 { font-size: 24px; margin: 8px 0 16px; }
  h2 { font-size: 17px; margin: 0 0 10px; color: #666; font-weight: 500; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  label { display: block; font-size: 14px; margin: 10px 0 4px; color: #666; }
  input { width: 100%; padding: 11px; font-size: 17px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; background: #fafafa; }
  button { margin-top: 12px; padding: 13px 16px; font-size: 17px; border: none; border-radius: 10px; background: #007aff; color: #fff; font-weight: 500; width: 100%; }
  button:active { background: #0062cc; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .big { font-size: 22px; font-weight: 600; color: #007aff; }
  .big.money { color: #34c759; }
  .month-head { display: flex; justify-content: space-between; align-items: baseline; background: #eef6ff; padding: 10px 12px; border-radius: 8px; margin: 14px 0 4px; font-weight: 500; font-size: 15px; }
  .month-head .money { color: #34c759; }
  .shift { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 15px; }
  .shift:last-child { border-bottom: none; }
  .shift small { color: #888; display: block; font-size: 12px; margin-top: 2px; }
  .shift .right { text-align: right; }
  .shift .money { color: #34c759; font-weight: 500; }
  .del { background: #ff3b30; color: #fff; border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; width: auto; margin: 4px 0 0; }
  .hint { font-size: 13px; color: #888; margin-top: 8px; }
  .rate-row { display: flex; gap: 10px; align-items: flex-end; }
  .rate-row > div:first-child { flex: 2; }
  .rate-row > div:last-child { flex: 1; }
</style>
</head>
<body>

<h1>📅 Мой график</h1>

<!-- СТАВКА -->
<div class="card">
  <h2>💵 Ставка</h2>
  <div class="rate-row">
    <div>
      <label>Цена часа (₽)</label>
      <input type="number" id="rate" value="276" min="0" step="1">
    </div>
    <div>
      <label>&nbsp;</label>
      <button onclick="saveRate()" style="margin-top:0">Сохранить</button>
    </div>
  </div>
</div>

<!-- ДОБАВЛЕНИЕ СМЕНЫ -->
<div class="card">
  <h2>➕ Добавить смену</h2>
  <label>Дата</label>
  <input type="date" id="date">

  <div class="row">
    <div>
      <label>Начало</label>
      <input type="time" id="start" value="14:00">
    </div>
    <div>
      <label>Конец</label>
      <input type="time" id="end" value="22:00">
    </div>
  </div>

  <label>Перерыв (минут, вычитается)</label>
  <input type="number" id="breakMin" value="30" min="0" step="5">

  <div class="hint" id="preview">Итого в зачёт: —</div>

  <button onclick="addShift()">Добавить</button>
</div>

<!-- ИТОГИ -->
<div class="card">
  <div style="display:flex;justify-content:space-between;font-size:16px;margin-bottom:8px">
    <span>Всего часов:</span>
    <span class="big" id="totalHours">0</span>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:16px">
    <span>Всего заработано:</span>
    <span class="big money" id="totalMoney">0 ₽</span>
  </div>
  <div id="list"></div>
</div>

<script>
const KEY = 'my_schedule_v4';
const RATE_KEY = 'my_rate';

let rate = parseFloat(localStorage.getItem(RATE_KEY)) || 276;

function load() { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

function money(mins) {
  return Math.round((mins / 60) * rate);
}
function fmtMoney(v) {
  return v.toLocaleString('ru-RU') + ' ₽';
}
function fmt(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `${h} ч ${m} мин` : `${h} ч`;
}

function saveRate() {
  const v = parseFloat(document.getElementById('rate').value);
  if (!v || v < 0) { alert('Введите корректную ставку'); return; }
  rate = v;
  localStorage.setItem(RATE_KEY, rate);
  render();
  updatePreview();
}

function calcMins() {
  const start = document.getElementById('start').value;
  const end = document.getElementById('end').value;
  const br = parseInt(document.getElementById('breakMin').value) || 0;
  if (!start || !end) return null;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins <= 0) mins += 24 * 60;
  return { gross: mins, net: Math.max(0, mins - br) };
}

function updatePreview() {
  const r = calcMins();
  const el = document.getElementById('preview');
  if (!r) { el.textContent = 'Итого в зачёт: —'; return; }
  el.textContent = `Смена ${fmt(r.gross)} − перерыв → ${fmt(r.net)} · ${fmtMoney(money(r.net))}`;
}

function addShift() {
  const date = document.getElementById('date').value;
  const start = document.getElementById('start').value;
  const end = document.getElementById('end').value;
  const br = parseInt(document.getElementById('breakMin').value) || 0;
  if (!date || !start || !end) { alert('Заполните дату и время'); return; }
  const r = calcMins();
  if (!r || r.net <= 0) { alert('Смена должна быть больше перерыва'); return; }

  const data = load();
  data.push({ date, start, end, br, mins: r.net });
  data.sort((a,b) => a.date.localeCompare(b.date));
  save(data);
  render();
}

function removeShift(i) {
  const data = load();
  data.splice(i, 1);
  save(data);
  render();
}

function render() {
  const data = load();
  const list = document.getElementById('list');
  const totalHoursEl = document.getElementById('totalHours');
  const totalMoneyEl = document.getElementById('totalMoney');

  document.getElementById('rate').value = rate;

  if (!data.length) {
    list.innerHTML = '<p style="color:#888;font-size:14px;margin-top:14px">Пока нет смен</p>';
    totalHoursEl.textContent = '0 ч';
    totalMoneyEl.textContent = '0 ₽';
    return;
  }

  const months = {};
  data.forEach((s, i) => {
    const m = s.date.slice(0, 7);
    (months[m] = months[m] || []).push({ ...s, index: i });
  });

  let html = '';
  Object.keys(months).sort().forEach(m => {
    const sumMins = months[m].reduce((a, s) => a + s.mins, 0);
    const sumMoney = money(sumMins);
    html += `<div class="month-head">
      <span>${m} · ${fmt(sumMins)}</span>
      <span class="money">${fmtMoney(sumMoney)}</span>
    </div>`;
    months[m].forEach(s => {
      const brText = s.br ? ` · перерыв ${s.br} мин` : '';
      html += `<div class="shift">
        <span>${s.date.slice(8,10)}.${s.date.slice(5,7)} · ${s.start}–${s.end}<small>${brText.replace(' · ','')}</small></span>
        <span class="right">
          ${fmt(s.mins)}<br>
          <span class="money">${fmtMoney(money(s.mins))}</span><br>
          <button class="del" onclick="removeShift(${s.index})">✕</button>
        </span>
      </div>`;
    });
  });

  list.innerHTML = html;
  const totalMins = data.reduce((a, s) => a + s.mins, 0);
  totalHoursEl.textContent = fmt(totalMins);
  totalMoneyEl.textContent = fmtMoney(money(totalMins));
}

document.getElementById('date').valueAsDate = new Date();
['start','end','breakMin'].forEach(id =>
  document.getElementById(id).addEventListener('input', updatePreview)
);
updatePreview();
render();
</script>
</body>
</html>
